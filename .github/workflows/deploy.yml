name: Deploy do painel administrativo

# Todo push na main gera o bundle e o publica na EC2; "Run workflow" repete sem commit novo.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-painel-admin
  cancel-in-progress: false

# A Action assume a role da AWS por OIDC: sem chave guardada no repositório.
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      # Entra no bundle em tempo de build: variável do repositório, não do servidor.
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
      EC2_INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
      DEPLOY_BUCKET: ${{ vars.DEPLOY_BUCKET }}
      SITE_URL: https://admin.elo.rodrigolim.com.br
      DIST_DIR: /var/www/trustimovel-vite-admin/dist

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Confere as variáveis
        run: |
          for name in VITE_API_BASE_URL EC2_INSTANCE_ID DEPLOY_BUCKET; do
            if [ -z "${!name}" ]; then
              echo "Defina a variável $name no repositório (Settings > Variables)."
              exit 1
            fi
          done

      - name: Instala as dependências
        run: npm ci

      - name: Verifica os tipos
        run: npx tsc --noEmit -p tsconfig.app.json

      - name: Gera o bundle
        run: npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publica na EC2 pelo Systems Manager
        run: |
          # O bundle vai pelo S3 e o servidor o baixa por URL pré-assinada, sem precisar de aws CLI lá.
          key="deploy/${GITHUB_REPOSITORY#*/}/${GITHUB_SHA}.tar.gz"
          tar -czf dist.tar.gz -C dist .
          aws s3 cp --quiet dist.tar.gz "s3://$DEPLOY_BUCKET/$key"
          dist_url=$(aws s3 presign "s3://$DEPLOY_BUCKET/$key" --expires-in 900)

          # O script do servidor viaja em base64 dentro do comando, para não depender de clone lá.
          script_b64=$(base64 -w0 scripts/deploy.sh)

          # O SSM executa como root; o sudo -u mantém a pasta do nginx com o dono certo (ubuntu).
          bash scripts/ssm-run.sh "deploy admin ${GITHUB_SHA::7}" <<EOF
          set -euo pipefail
          echo "$script_b64" | base64 -d > /tmp/deploy-painel.sh
          sudo -u ubuntu -H env DIST_URL='$dist_url' DIST_DIR='$DIST_DIR' bash /tmp/deploy-painel.sh
          rm -f /tmp/deploy-painel.sh
          EOF

      - name: Verifica o site publicado
        run: |
          # O index publicado precisa apontar para um asset que o servidor realmente serve.
          asset=$(curl -fsS "$SITE_URL/" | grep -o 'assets/index-[^"]*\.js' | head -1)
          test -n "$asset"
          curl -fsS -o /dev/null "$SITE_URL/$asset"
          echo "Publicado: $asset"
